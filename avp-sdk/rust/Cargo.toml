[package]
name = "avp"
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
description = "AVP wire types and shared agent helpers"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
indexmap = "2"
jsonschema = { version = "0.60.2", default-features = false }
regress = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.6"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "cli-fixture"
path = "tests/fixtures/agent.rs"
