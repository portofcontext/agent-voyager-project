name: Release gemini-cli agent

# Publishes the avp-gemini-cli package archive as a GitHub release, which
# `avp agent install gemini-cli` and the sandbox container recipe download.
# Triggered by pushing a tag `agent-gemini-cli-v<version>` (e.g.
# agent-gemini-cli-v0.1.0), or run manually from the Actions tab with an
# explicit version.
#
# One archive serves every platform: Gemini CLI's optional native modules are
# left out and its required one ships per-platform prebuilds (see
# scripts/package.sh).

on:
  push:
    tags: ["agent-gemini-cli-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (tag becomes agent-gemini-cli-v<version>)"
        required: true

permissions:
  contents: write # agent-release.yml creates the release

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The adapter's build compiles the in-repo TypeScript binding, which needs
      # its own dependencies (CI's bindings job installs them in an earlier step).
      - name: Install the TypeScript binding's dependencies
        working-directory: avp/bindings/typescript
        run: npm ci

      - name: Integration tests
        working-directory: agents/avp-gemini-cli/typescript
        run: npm ci --omit=optional && npm test

      - name: Package the archive
        run: agents/avp-gemini-cli/typescript/scripts/package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: dist/avp-gemini-cli.tar.gz
          if-no-files-found: error

  release:
    needs: build
    uses: ./.github/workflows/agent-release.yml
    with:
      agent: gemini-cli
      tag: ${{ github.event_name == 'workflow_dispatch' && format('agent-gemini-cli-v{0}', inputs.version) || github.ref_name }}
