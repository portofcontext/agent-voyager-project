name: Release openai-agents agent

# Publishes the openai-agents agent's wheels as a GitHub release, which
# `avp agent install openai-agents` then downloads and installs into a managed venv.
# The unpublished in-repo `avp` wheel ships alongside the agent wheel so the
# installer installs it by path (PyPI's unrelated `avp` is never pulled); the
# OpenAI Agents SDK (openai-agents) comes from PyPI.
#
# Triggered by pushing a tag `agent-openai-agents-v<version>`, or run manually with an
# explicit version.

on:
  push:
    tags: ["agent-openai-agents-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.0.1 (tag becomes agent-openai-agents-v<version>)"
        required: true

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    name: Build wheels + publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Build the agent + its in-repo dependency wheel
        run: |
          uv build --package agent-voyager-project --out-dir dist
          uv build --package avp-openai-agents --out-dir dist

      - name: Roll up checksums
        run: cd dist && shasum -a 256 *.whl > SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="agent-openai-agents-v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "openai-agents agent $TAG" \
            --notes "Wheels for the openai-agents agent (+ the avp wire-types wheel). Install with: avp agent install openai-agents --version ${TAG#agent-openai-agents-v}" \
            || gh release upload "$TAG" dist/*.whl dist/SHA256SUMS --repo "${{ github.repository }}" --clobber
