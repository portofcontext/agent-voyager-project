name: Release openai-agents agent

# Builds the openai-agents agent's wheels, with the in-repo wheels it imports (they
# are not on PyPI). agent-release.yml then locks its dependencies to the
# workspace lock, runs it in a sandbox image against a stub model, and
# publishes the GitHub release that `avp agent install openai-agents` installs.
#
# Triggered by pushing a tag `agent-openai-agents-v<version>`, or run manually with an
# explicit version.

on:
  push:
    tags: ["agent-openai-agents-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.0.1 (tag becomes agent-openai-agents-v<version>)"
        required: true

permissions:
  contents: write # agent-release.yml creates the release

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the agent and its in-repo dependency wheels
        run: |
          uv build --wheel --package agent-voyager-project --out-dir dist
          uv build --wheel --package avp-openai-agents --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: build
    uses: ./.github/workflows/agent-release.yml
    with:
      agent: openai-agents
      tag: ${{ github.event_name == 'workflow_dispatch' && format('agent-openai-agents-v{0}', inputs.version) || github.ref_name }}
