name: Build skill artifact

# Package instructions and offline references; check every base in a PR stack.

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "avp/core/spec/v0.1/**"
      - "FOUNDATIONS.md"
      - "LICENSE"
      - "avp/scripts/build-skill.sh"
      - ".github/workflows/build-skill.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "SKILL.md"
      - "avp/core/spec/v0.1/**"
      - "FOUNDATIONS.md"
      - "LICENSE"
      - "avp/scripts/build-skill.sh"
      - ".github/workflows/build-skill.yml"
  workflow_dispatch:

permissions:
  contents: write   # required to attach .skill to a Release on tag pushes

jobs:
  build:
    name: Package avp.skill
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build avp.skill
        run: bash avp/scripts/build-skill.sh dist

      - name: Verify archive and bundled references
        run: |
          python - <<'PY'
          import posixpath
          import re
          import zipfile
          from urllib.parse import unquote, urlsplit

          with zipfile.ZipFile("dist/avp.skill") as bundle:
              assert bundle.testzip() is None
              names = set(bundle.namelist())
              assert "avp/SKILL.md" in names
              for name in names:
                  if not name.endswith(".md"):
                      continue
                  for target in re.findall(r"\]\(([^)]+)\)", bundle.read(name).decode()):
                      url = urlsplit(target)
                      if url.scheme or not url.path:
                          continue
                      path = posixpath.normpath(posixpath.join(posixpath.dirname(name), unquote(url.path)))
                      assert path in names or any(n.startswith(path.rstrip("/") + "/") for n in names), (name, target)
              print("Archive and local reference paths verified")
          PY

      - name: Upload avp.skill as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: avp-skill
          path: dist/avp.skill
          if-no-files-found: error
          retention-days: 30

      # On tag pushes (e.g. `v0.1.0`), attach the .skill to the GitHub Release.
      - name: Attach .skill to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/avp.skill
          fail_on_unmatched_files: true
          generate_release_notes: true
