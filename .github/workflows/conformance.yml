name: Conformance Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# All AVP-conforming implementations must pass the language-agnostic conformance
# suite. This workflow gates that contract on every push and PR.

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Sync the workspace
        run: uv sync --locked
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  spec-and-conformance:
    name: Spec validation + Python conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      # The repo is a uv workspace rooted at the repo root; `uv sync` installs
      # every Python member editable and resolves the cross-package deps (`avp`,
      # `avp-conformance`, ...) to the in-tree sources rather than PyPI. (There's
      # an unrelated `avp` package on PyPI; the workspace sources override it.)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --locked

      - name: Validate conformance case files against the test-case schema
        run: uv run avp-conformance validate

      # Use the same package list as local checks, including new adapters and templates.
      - name: Run every Python package's deterministic tests
        run: make test

  bindings:
    name: Rust and TypeScript bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            avp/bindings/rust
            agents/_template/rust
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rust binding tests
        run: cargo test --locked --manifest-path avp/bindings/rust/Cargo.toml
      - name: Rust template tests when present
        run: |
          if [ -f agents/_template/rust/Cargo.toml ]; then
            cargo test --locked --manifest-path agents/_template/rust/Cargo.toml
          fi
      - name: TypeScript binding tests
        working-directory: avp/bindings/typescript
        run: npm ci && npm test

  goose:
    name: Goose Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agents/avp-goose/rust
      # Hosted-provider tests do not need the optional llama.cpp backend.
      - name: Test the Goose adapter and native MCP connection
        run: cargo test --locked --manifest-path agents/avp-goose/rust/Cargo.toml --no-default-features --features conformance

  codex-native:
    name: Native Codex (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native shell tests need a host that permits Bubblewrap network namespaces.
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --project agents/avp-codex/python
      - name: Exercise the bundled Codex runtime and managed MCP tools
        env:
          AVP_TEST_CODEX: "1"
        run: cd agents/avp-codex/python && uv run --no-sync pytest -q tests/test_native.py

  claude-native:
    name: Claude native integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: agents/avp-claude-agent-sdk/python
        run: |
          uv sync --locked
          version=$(uv run --no-sync python -c 'from avp_claude_agent_sdk.descriptor import CLAUDE_VERSION; print(CLAUDE_VERSION)')
          npm install --global "@anthropic-ai/claude-code@$version"
          AVP_TEST_CLAUDE=1 uv run --no-sync pytest -q

  openai-agents-sdk:
    name: avp-openai-agents SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: make openai-agents-check

  deep-agents-sdk:
    name: avp-deep-agents SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: make deep-agents-check

  sdk:
    name: Python, Rust, and TypeScript SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: avp-sdk/rust
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make sdk-python-check sdk-rust-check sdk-typescript-check

  pi-sdk:
    name: Pi SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make pi-check

  gemini-cli-sdk:
    name: Gemini CLI SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: make gemini-cli-check

  opencode-sdk:
    name: OpenCode SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: make opencode-check
