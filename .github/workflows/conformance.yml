name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: SDKs, CLI, and adapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: make check
      - name: Check generated schemas and types
        run: |
          make schemas bindings
          git diff --exit-code -- spec/v0.1 avp-sdk/typescript/src

  codex-native:
    name: Native Codex (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native shell tests need a host that permits Bubblewrap network namespaces.
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --project agents/avp-codex/python
      - name: Exercise the bundled Codex runtime and managed MCP tools
        env:
          AVP_TEST_CODEX: "1"
        run: cd agents/avp-codex/python && uv run --no-sync pytest -q tests/test_native.py

  claude-native:
    name: Claude native integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - working-directory: agents/avp-claude-agent-sdk/python
        run: |
          uv sync --locked
          version=$(uv run --no-sync python -c 'from avp_claude_agent_sdk.descriptor import CLAUDE_VERSION; print(CLAUDE_VERSION)')
          npm install --global "@anthropic-ai/claude-code@$version"
          AVP_TEST_CLAUDE=1 uv run --no-sync pytest -q

  atif-ecosystem:
    name: Upstream ATIF consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Check native recording with Harbor models, trace extraction, and viewer
        run: |
          uv venv
          uv pip install 'harbor @ git+https://github.com/harbor-framework/harbor.git@9c7a39b991d7e2205019f6be0598cbd22d84bfc3' httpx
          .venv/bin/python scripts/test-atif-ecosystem.py
