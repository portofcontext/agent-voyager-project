name: Agent images

# Publishes each built-in agent's image for the source commit and versions in
# builtins.json. A version that is already published is left as it is.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: echo "matrix=$(python scripts/agent-images.py matrix)" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.name }}
    needs: agents
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.agents.outputs.matrix) }}
    env:
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: avp-cli/src/avp_cli/agents/dockerfiles/${{ matrix.name }}.Dockerfile
      CONTEXT: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
          path: source
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Skip a published version
        id: published
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already published" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.published.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.skip != 'true'
      - name: Build and check ping
        if: steps.published.outputs.skip != 'true'
        run: |
          docker buildx build --load --tag agent --file "$DOCKERFILE" "$CONTEXT"
          docker run --rm agent ping
      - name: Publish for amd64 and arm64
        if: steps.published.outputs.skip != 'true'
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=${{ matrix.commit }}" \
            --file "$DOCKERFILE" "$CONTEXT"
          echo "Published $IMAGE" >> "$GITHUB_STEP_SUMMARY"
