[project]
name = "agent-voyager-project"
version = "0.1.0"
description = "Python SDK for the Agent Voyager Project (AVP) v0.1 specs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Homepage = "https://github.com/portofcontext/agent-voyager-project"
Spec = "https://github.com/portofcontext/agent-voyager-project/tree/main/spec/v0.1"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
