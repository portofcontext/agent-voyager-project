[project]
name = "avp-openai-agents"
version = "0.0.4"
description = "AVP agent over the OpenAI Agents SDK."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["agent-voyager-project", "openai-agents==0.23.1", "jsonschema>=4"]

[project.optional-dependencies]
litellm = ["openai-agents[litellm]==0.23.1"]

[project.scripts]
avp-openai-agents-cli = "avp_openai_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[tool.uv.sources]
agent-voyager-project = { path = "../../../avp-sdk/python", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_openai_agents"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
