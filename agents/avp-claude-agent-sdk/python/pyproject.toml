[project]
name = "avp-claude-agent-sdk"
version = "0.2.3"
description = "AVP agent over Claude Code through the Claude Agent SDK."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["agent-voyager-project @ https://github.com/portofcontext/agent-voyager-project/releases/download/sdk-python-v0.1.0b1/agent_voyager_project-0.1.0b1-py3-none-any.whl", "claude-agent-sdk==0.2.87", "jsonschema>=4"]

[project.scripts]
avp-claude-agent-sdk-cli = "avp_claude_agent_sdk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_claude_agent_sdk"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
