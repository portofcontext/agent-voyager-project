[project]
name = "avp-deep-agents"
version = "0.1.2"
description = "AVP agent over LangChain Deep Agents."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["agent-voyager-project", "deepagents==0.7.25", "langchain-anthropic==1.7.6", "langchain-google-genai==4.4.2", "langchain-mcp-adapters==0.3.2", "langchain-openai==1.7.1", "jsonschema>=4"]

[project.scripts]
avp-deep-agents-cli = "avp_deep_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[tool.uv.sources]
agent-voyager-project = { path = "../../../avp-sdk/python", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_deep_agents"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
