[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avp-deep-agents"
version = "0.1.1"
description = "AVP agent over LangChain Deep Agents, plus a LangChain callback handler that records any LangChain or LangGraph run as an AVP trajectory."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "agent-voyager-project==0.2.0",
    "deepagents==0.7.25",
    "langchain-anthropic==1.7.6",
    "langchain-google-genai==4.4.2",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.7.1",
]

[tool.uv.sources]
agent-voyager-project = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/avp_deep_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# How this agent installs and runs in a sandbox: release-manifest.py writes it
# into the release's avp-release.json, with the workspace lock as requirements.txt.
[tool.avp.release]
agent = "deep-agents"
module = "avp_deep_agents.conformance"
wheels = ["agent-voyager-project", "avp-deep-agents"]
