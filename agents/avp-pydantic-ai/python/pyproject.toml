[project]
name = "avp-pydantic-ai"
version = "0.0.4"
description = "AVP agent over Pydantic AI: the framework runs the loop, the adapter writes the Trajectory."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "agent-voyager-project",
    "pydantic-ai-slim[anthropic,google,mcp,openai]==2.64.0",
]

[project.scripts]
avp-pydantic-ai-cli = "avp_pydantic_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[tool.uv.sources]
agent-voyager-project = { path = "../../../avp-sdk/python", editable = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_pydantic_ai"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
