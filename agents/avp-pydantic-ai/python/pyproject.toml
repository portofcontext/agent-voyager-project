[project]
name = "avp-pydantic-ai"
version = "0.0.5"
description = "AVP agent over Pydantic AI: the framework runs the loop, the adapter writes the Trajectory."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "agent-voyager-project @ https://github.com/portofcontext/agent-voyager-project/releases/download/sdk-python-v0.1.0b2/agent_voyager_project-0.1.0b2-py3-none-any.whl",
    "pydantic-ai-slim[anthropic,google,mcp,openai]==2.64.0",
]

[project.scripts]
avp-pydantic-ai-cli = "avp_pydantic_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_pydantic_ai"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
