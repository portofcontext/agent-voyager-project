[project]
name = "avp-codex"
version = "0.0.6"
description = "AVP agent over Codex: Codex runs the loop, the adapter writes the Trajectory."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["agent-voyager-project>=0.1.0b3", "openai-codex==0.162.1", "jsonschema>=4"]

[project.scripts]
avp-codex-cli = "avp_codex.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ty>=0.0.95"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "avp_codex"

[tool.ty.environment]
extra-paths = ["../../../testing/atif"]
python-version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["../../../testing/atif"]
testpaths = ["tests"]

[tool.uv.sources]
agent-voyager-project = { path = "../../../avp-sdk/python", editable = true }
