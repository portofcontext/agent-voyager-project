[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avp-codex"
version = "0.0.1"
description = "AVP observer for the native OpenAI Codex app-server."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-voyager-project==0.1.1"]

[tool.uv.sources]
agent-voyager-project = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/avp_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
