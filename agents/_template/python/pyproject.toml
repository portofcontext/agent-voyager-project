[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Rename on copy: the distribution, the import package under src/, and the
# module in avp-conformance.json.
name = "avp-agent-template"
version = "0.0.1"
description = "Template for a new AVP agent: copy, rename, and replace the stand-in harness."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-voyager-project==0.1.1"]

[tool.uv.sources]
agent-voyager-project = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/avp_agent_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
